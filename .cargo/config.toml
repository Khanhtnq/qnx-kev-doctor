# QNX Neutrino 8.0 Cross-Compilation Targets Documentation & Configuration
# For BlackBerry QNX SDP 8.0 (Software Development Platform 8.0)
#
# Target Architectures:
# 1. aarch64-unknown-nto-qnx800 (Raspberry Pi 5, NXP i.MX95, Qualcomm SA8295P)
# 2. x86_64-pc-nto-qnx800 (x86_64 QEMU, Intel Alder Lake-S, AMD Embedded)
#
# To compile for QNX SDP 8.0:
#   source ~/qnx800/qnxsdp-env.sh
#   cargo build --target aarch64-unknown-nto-qnx800 --release
#
# Target Linker Specifications:

[target.aarch64-unknown-nto-qnx800]
linker = "qcc"
rustflags = [
    "-C", "link-args=-Vgcc_ntoaarch64_cxx -lang-c++ -Y_gpp -lsocket",
]

[target.x86_64-pc-nto-qnx800]
linker = "qcc"
rustflags = [
    "-C", "link-args=-Vgcc_ntox86_64_cxx -lang-c++ -Y_gpp -lsocket",
]
